name: Offline safety and binary validators
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q remnawave_injector.py egames_safe.py inbound_tag_plan.py tests
      - run: |
          for script in *.sh; do bash -n "$script"; done
          shellcheck *.sh tests/nginx-docker.sh
      - name: Download official pinned Xray and verify published checksum
        run: |
          mkdir -p .tools/xray
          curl -fSL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip -o .tools/xray.zip
          curl -fSL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip.dgst -o .tools/xray.zip.dgst
          expected=$(sed -n 's/^SHA2-256= //p' .tools/xray.zip.dgst | tr -d '\r\n')
          test -n "$expected"
          printf '%s  .tools/xray.zip\n' "$expected" | sha256sum -c -
          unzip -q .tools/xray.zip -d .tools/xray
          chmod +x .tools/xray/xray
      - name: Validate Xray and real Linux Nginx, without starting listeners
        env:
          XRAY_BINARY: .tools/xray/xray
          NGINX_BINARY: tests/nginx-docker.sh
        run: |
          chmod +x tests/nginx-docker.sh
          docker pull nginx:1.30
          python tests/validate_binaries.py

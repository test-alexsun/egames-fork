name: Offline safety and binary validators
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: >-
          pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python tests/validate_sources.py
      - run: python tests/scan_secrets.py
      - run: python -m compileall -q remnawave_injector.py egames_safe.py inbound_tag_plan.py inbound_tags.py tag_migration.py node_only.py tests
      - run: |
          for script in *.sh tests/*.sh; do bash -n "$script"; done
          shellcheck *.sh tests/*.sh
      - name: Download official pinned Xray and verify published checksum
        run: |
          mkdir -p .tools/xray
          url=$(python -c 'import json; print(json.load(open("validation-manifest.json"))["xray"]["linux_amd64_url"])')
          expected=$(python -c 'import json; print(json.load(open("validation-manifest.json"))["xray"]["sha256"])')
          curl -fSL --retry 3 "$url" -o .tools/xray.zip
          printf '%s  .tools/xray.zip\n' "$expected" | sha256sum -c -
          unzip -q .tools/xray.zip -d .tools/xray
          chmod +x .tools/xray/xray
      - name: Validate Xray and real Linux Nginx, without starting listeners
        env:
          XRAY_BINARY: .tools/xray/xray
          NGINX_BINARY: tests/nginx-docker.sh
        run: |
          chmod +x tests/nginx-docker.sh
          docker pull "$(python -c 'import json; print(json.load(open("validation-manifest.json"))["nginx_image"])')"
          python tests/validate_binaries.py
  debian-unit:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: apt-get update && apt-get install -y python3 python3-venv shellcheck
      - run: python3 -m venv /tmp/test-venv
      - run: >-
          /tmp/test-venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: /tmp/test-venv/bin/python -B -m unittest discover -s tests -v
      - run: shellcheck *.sh tests/*.sh

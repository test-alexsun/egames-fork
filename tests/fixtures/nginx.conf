map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    server_name panel.example.com;
    http2 on;
    ssl_certificate /etc/nginx/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example/privkey.pem;
    location ^~ /api/ { proxy_pass http://127.0.0.1:3000; }
    location / { if ($http_cookie = "") { return 404; } proxy_pass http://127.0.0.1:3000; }
}
server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    server_name sub.example.com;
    http2 on;
    ssl_certificate /etc/nginx/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example/privkey.pem;
    location / { proxy_pass http://127.0.0.1:3010; }
}
server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    server_name node.example.com;
    http2 on;
    ssl_certificate /etc/nginx/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example/privkey.pem;
    root /var/www/html;
    index index.html;
}

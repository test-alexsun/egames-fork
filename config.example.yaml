# ============================================================
# Remnawave eGames Injector — всё в одном файле
# Скопируйте:  cp config.example.yaml config.yaml
# Заполните только обязательные поля ниже.
# ============================================================

# --- ОБЯЗАТЕЛЬНО ---
# Bearer-токен панели (Settings → API Tokens). Можно rwa_... или JWT.
panel_api_token: "rwa_REPLACE_ME"

# Публичный адрес ноды (домен или IP) — пойдёт в Hosts
host_address: "node.example.com"

# --- Обычно менять не нужно ---
# Локальный API на сервере панели (как в eGames)
panel_api_url: "http://127.0.0.1:3000/api"

# Cookie gate eGames (name=value). Пусто = localhost без cookie.
egames_cookie: ""

# Имя Config Profile (создастся, если нет)
profile_name: "eGames-MultiProtocol"

# Имя Internal Squad (inbounds добавятся в него)
internal_squad_name: "Default-Squad"

# UUID ноды. Пусто = первая доступная нода автоматически
node_uuid: ""

# Префикс remark для хостов (например страна)
host_remark_prefix: "EE-ee"

# SNI / serverNames для REALITY (пусто = берётся host_address)
reality_server_name: ""

# Dest для REALITY (eGames по умолчанию: unix-socket nginx)
reality_dest: "/dev/shm/nginx.sock"

# Таймаут HTTP
timeout: 30

# true = только лог, без записи
dry_run: false

log_level: "INFO"

# ------------------------------------------------------------
# Целевые inbounds. Всё прописано здесь — скрипт ничего не спрашивает.
# ------------------------------------------------------------
target_inbounds:
  - tag: "VLESS-REALITY-VISION"
    remark: "⚡ VLESS REALITY + Vision"
    port: 8443
    protocol: "vless"
    network: "tcp"
    security: "reality"
    flow: "xtls-rprx-vision"

  - tag: "VLESS-WS-TLS"
    remark: "🌐 VLESS WebSocket + TLS"
    port: 44205
    protocol: "vless"
    network: "ws"
    security: "tls"
    path: "/vlessws"

  - tag: "VLESS-XHTTP-TLS"
    remark: "📡 VLESS XHTTP + TLS"
    port: 10443
    protocol: "vless"
    network: "xhttp"
    security: "tls"
    path: "/xhttp"

  - tag: "VLESS-XHTTP-REALITY"
    remark: "🛡️ VLESS XHTTP + REALITY"
    port: 34544
    protocol: "vless"
    network: "xhttp"
    security: "reality"
    path: "/xhreality"

  - tag: "VLESS-XHTTP-PQ"
    remark: "🔐 VLESS Encryption (PQ)"
    port: 34514
    protocol: "vless"
    network: "xhttp"
    security: "reality"
    path: "/xhpq"

  - tag: "TROJAN-GRPC-TLS"
    remark: "🚀 Trojan gRPC + TLS"
    port: 10399
    protocol: "trojan"
    network: "grpc"
    security: "tls"
    service_name: "trojangrpc"

  - tag: "VMESS-WS-TLS"
    remark: "📦 VMess WebSocket + TLS"
    port: 55574
    protocol: "vmess"
    network: "ws"
    security: "tls"
    path: "/vmessws"

  - tag: "SS-2022"
    remark: "🔑 Shadowsocks 2022"
    port: 15714
    protocol: "shadowsocks"
    method: "2022-blake3-aes-128-gcm"
    network: "tcp"

  - tag: "HYSTERIA2"
    remark: "💨 Hysteria2"
    port: 36712
    protocol: "hysteria2"
    network: "udp"
    security: "tls"

# ============================================================
# eGames / Remnawave Injector — config.example.yaml
#
# На сервере с eGames install.sh сам подставит:
#   panel_api_token, host_address, egames_cookie, reality_*
# из /usr/local/remnawave_reverse/token и /opt/remnawave/.env
#
# Протоколы соответствуют ограничениям Remnawave API (A061).
# ============================================================


# --- ОБЯЗАТЕЛЬНО ---
# Bearer-токен панели (Settings → API Tokens). Можно rwa_... или JWT.
panel_api_token: "rwa_REPLACE_ME"

# Публичный адрес ноды (домен или IP) — пойдёт в Hosts
host_address: "node.example.com"

# --- Обычно менять не нужно ---
# Локальный API на сервере панели (как в eGames)
panel_api_url: "http://127.0.0.1:3000/api"

# Cookie gate eGames (name=value). Пусто = localhost без cookie.
egames_cookie: ""

# Имя Config Profile (создастся, если нет)
profile_name: "eGames-MultiProtocol"

# Имя Internal Squad (inbounds добавятся в него)
internal_squad_name: "Default-Squad"

# UUID ноды. Пусто = первая доступная нода автоматически
node_uuid: ""

# Префикс remark для хостов (например страна)
host_remark_prefix: "EE-ee"

# SNI / serverNames для REALITY (пусто = берётся host_address)
reality_server_name: ""

# Сертификат для TLS-inbounds (WS/XHTTP/gRPC/HTTPUpgrade). Пути — ВНУТРИ контейнера remnanode
# (смонтируйте в remnanode: /etc/letsencrypt:/etc/letsencrypt:ro).
# Без этих значений TLS-inbounds создаются без certificates и работать не будут.
tls_cert_file: "/etc/letsencrypt/live/sw126-web.alexsun55.ru/fullchain.pem"
tls_key_file: "/etc/letsencrypt/live/sw126-web.alexsun55.ru/privkey.pem"

# Dest для REALITY (eGames по умолчанию: unix-socket nginx)
reality_dest: "/dev/shm/nginx.sock"  # fallback: www.cloudflare.com:443

# Таймаут HTTP
timeout: 30

# true = только лог, без записи
dry_run: false

log_level: "INFO"

# ------------------------------------------------------------
# Целевые inbounds. Всё прописано здесь — скрипт ничего не спрашивает.
# ------------------------------------------------------------
target_inbounds:
  - tag: "VLESS-REALITY-VISION"
    remark: "⚡ VLESS REALITY + Vision"
    port: 8443
    protocol: "vless"
    network: "raw"
    security: "reality"
    flow: "xtls-rprx-vision"

  - tag: "VLESS-WS-TLS"
    remark: "🌐 VLESS WebSocket + TLS"
    port: 44205
    protocol: "vless"
    network: "ws"
    security: "tls"
    path: "/vlessws"

  - tag: "VLESS-XHTTP-TLS"
    remark: "📡 VLESS XHTTP + TLS"
    port: 10443
    protocol: "vless"
    network: "xhttp"
    security: "tls"
    path: "/xhttp"

  - tag: "VLESS-XHTTP-REALITY"
    remark: "🛡️ VLESS XHTTP + REALITY"
    port: 34544
    protocol: "vless"
    network: "xhttp"
    security: "reality"
    path: "/xhreality"

  - tag: "VLESS-XHTTP-PQ"
    remark: "🔐 VLESS Encryption (PQ)"
    port: 34514
    protocol: "vless"
    network: "xhttp"
    security: "reality"
    path: "/xhpq"

  - tag: "TROJAN-GRPC-TLS"
    remark: "🚀 Trojan gRPC + TLS"
    port: 10399
    protocol: "trojan"
    network: "grpc"
    security: "tls"
    service_name: "trojangrpc"

  - tag: "VLESS-HTTPUPGRADE-TLS"
    remark: "📦 VLESS HTTPUpgrade + TLS"
    port: 55574
    protocol: "vless"
    network: "httpupgrade"
    security: "tls"
    path: "/vlesshu"

  - tag: "SS-2022"
    remark: "🔑 Shadowsocks 2022"
    port: 15714
    protocol: "shadowsocks"
    method: "2022-blake3-aes-256-gcm"
    network: "raw"

